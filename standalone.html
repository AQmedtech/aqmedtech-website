        content: `Hypertension, commonly known as high blood pressure, is one of the most dangerous yet underdiagnosed conditions affecting Nigerians today. It occurs when the force of blood pushing against the walls of your arteries is consistently too high — typically defined as a reading of 140/90 mmHg or above. What makes hypertension particularly treacherous is that it rarely announces itself. Most people feel perfectly fine for years while the condition silently damages their heart, kidneys, eyes, and blood vessels. This is why cardiologists and public health experts refer to it as "the silent killer." By the time symptoms appear — if they appear at all — serious organ damage may already have occurred.

The burden of hypertension in Nigeria is alarming and growing. Studies published in the Nigerian Journal of Cardiology estimate that over 38% of Nigerian adults are hypertensive, yet fewer than a third of them are aware of their condition. The situation is compounded by limited access to routine health screenings, particularly in rural areas, and a cultural tendency to seek medical care only when symptoms become severe. With a population of over 200 million, this means tens of millions of Nigerians are walking around with dangerously high blood pressure and have no idea. The economic and social cost — in strokes, heart attacks, and kidney failure — is enormous.

Several risk factors are especially prevalent in the Nigerian context. High dietary salt intake is a major culprit; many traditional Nigerian dishes are prepared with significant amounts of sodium, and processed foods are increasingly popular in urban areas. Chronic stress — from economic pressures, long commutes, job insecurity, and family responsibilities — is another powerful driver that is often dismissed as simply "life." Genetics also plays a significant role; if one or both of your parents had hypertension, your risk is substantially higher. Other contributors include physical inactivity, obesity, excessive alcohol consumption, and tobacco use.

What symptoms should you watch for? The frustrating truth is that most people experience no symptoms at all. Some may notice occasional headaches, particularly at the back of the head in the mornings, mild dizziness, nosebleeds, or a feeling of pressure behind the eyes. However, these symptoms are non-specific and easily attributed to other causes. The only reliable way to know your blood pressure is to measure it. Adults should have their blood pressure checked at least once every year, and more frequently if they have risk factors. Home blood pressure monitors are now widely available and affordable in Nigeria, making regular self-monitoring a realistic option for many families.

    // Utility: Client-Side Fast Image Compressor (Reduces raw 5MB photos to ~70KB WebP)
    function compressImageFile(file, maxWidth = 1200, quality = 0.75) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            // Export as modern WebP
            resolve(canvas.toDataURL('image/webp', quality));
          };
          img.onerror = reject;
        };
        reader.onerror = reject;
      });
    }

      });
      const [likesCount, setLikesCount] = React.useState(article.likes || 0);

      // Views auto-increment (sessionStorage guarded to count once per session)
      React.useEffect(() => {
        try {
          const sessionKey = `aqmt_viewed_${article.id}`;
          if (!sessionStorage.getItem(sessionKey)) {
            sessionStorage.setItem(sessionKey, 'true');
            const nextViews = (article.views || 0) + 1;
            if (onUpdateArticle) {
              onUpdateArticle({ ...article, views: nextViews });
            }
          }
        } catch(e) {}

        const nextLiked = !liked;
        const nextCount = nextLiked ? likesCount + 1 : Math.max(0, likesCount - 1);
        setLiked(nextLiked);
        setLikesCount(nextCount);
        try {
          localStorage.setItem(`aqmt_liked_${article.id}`, nextLiked ? 'true' : 'false');
        } catch(e) {}
        if (onUpdateArticle) {
          onUpdateArticle({ ...article, likes: nextCount });

        e.preventDefault();
        if (!newComment.name.trim() || !newComment.text.trim()) return;

          id: Date.now(),
          name: newComment.name,
          text: newComment.text,
          date: 'Just now',
          authorReply: null
        };
        const updated = [...comments, comment];
        setComments(updated);
        if (onUpdateArticle) onUpdateArticle({ ...article, comments: updated });
        setNewComment({ name: '', text: '' });
        setSubmitted(true);

                      <p className="font-bold text-slate-900 text-sm">{c.name}</p>
                      <span className="text-[10px] text-slate-400">{c.date}</span>
                    </div>
                    <p className="text-slate-700 text-sm leading-relaxed">{c.text}</p>
                    {c.authorReply && (
                      <div className="mt-3 p-3 rounded-xl bg-teal-50 border-l-4 border-teal-600">
                        <p className="text-xs font-bold text-teal-800 mb-1">✅ Verified Author / Doctor Response:</p>
                        <p className="text-slate-700 text-xs leading-relaxed">{c.authorReply}</p>
                      </div>
                    )}
                  </div>
                ))}
              </div>

              {/* Add Comment Form */}
              <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                <h4 className="font-bold text-slate-900 text-base mb-3">Ask a Question or Leave a Comment</h4>
                {submitted && (
                  <div className="mb-4 p-3 bg-green-50 text-green-700 text-xs font-bold rounded-xl flex items-center gap-2">
                    <CheckCircle size={16} /> Your comment has been posted!
                  </div>
                )}
                <form onSubmit={handleComment} className="space-y-3">
                  <input
                    type="text"
                    placeholder="Your Full Name *"
                    required
                    value={newComment.name}
                    onChange={(e) => setNewComment(prev => ({...prev, name: e.target.value}))}
                    className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-blue-500 focus:outline-none text-sm"
                  />
                  <textarea
                    rows={3}
                    placeholder="Write your question for the doctor or tech contributor... *"
                    required
                    value={newComment.text}
                    onChange={(e) => setNewComment(prev => ({...prev, text: e.target.value}))}
                    className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-blue-500 focus:outline-none text-sm resize-none"
                  />
                  <button type="submit" className="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm rounded-xl shadow">
                    Submit Comment →
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // --- NEWS FEED PAGE ---
    const NewsPage = ({ articles, ads, onUpdateArticle, onOpenModal }) => {
      const [selectedArticle, setSelectedArticle] = React.useState(null);
      const [activeCategory, setActiveCategory] = React.useState('All');
      const [searchQuery, setSearchQuery] = React.useState('');
      const { Search } = Icons;
      const categories = ['All', 'Health & Medicine', 'Tech & Innovation', 'Business Growth'];

      // Only display approved articles on the public news feed
      const publicArticles = articles.filter(a => a.status === 'approved' || !a.status);

      const filtered = publicArticles.filter(article => {
        const matchesCategory = activeCategory === 'All' || article.category === activeCategory;
        const matchesSearch = !searchQuery.trim() ||
          article.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
          article.authorName.toLowerCase().includes(searchQuery.toLowerCase()) ||
          article.authorCredential.toLowerCase().includes(searchQuery.toLowerCase()) ||
          (article.content && article.content.toLowerCase().includes(searchQuery.toLowerCase()));
        return matchesCategory && matchesSearch;
      });

      if (selectedArticle) {
        return (
          <ArticleReader
            article={selectedArticle}
            ads={ads}
            onBack={() => setSelectedArticle(null)}
            onUpdateArticle={(updated) => {
              onUpdateArticle(updated);
              setSelectedArticle(updated);
            }}
            onOpenModal={onOpenModal}
          />
        );
      }

      return (
        <div className="min-h-screen bg-slate-50">
          <div className="py-12 px-4 text-white text-center" style={{ background: '#0F172A' }}>
            <div className="max-w-4xl mx-auto">
              <span className="text-xs font-bold text-teal-400 tracking-wider uppercase bg-teal-950 px-3 py-1 rounded-full border border-teal-800">
                Medical & Tech Publications
              </span>
              <h1 className="text-3xl sm:text-4xl font-black mt-3 mb-2">Health & Tech News Hub</h1>
              <p className="text-slate-300 text-sm sm:text-base max-w-xl mx-auto mb-6">
                Read clinical analyses, digital health trends, and SME growth strategies written by verified physicians and engineers.
              </p>

              {/* Instant Search Bar */}
              <div className="max-w-lg mx-auto relative">
                <Search size={18} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" />
                <input
                  type="text"
                  placeholder="Search articles, topics or doctors (e.g. Hypertension, AI)..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full pl-11 pr-4 py-3 rounded-2xl bg-white/10 backdrop-blur-md text-white placeholder-slate-400 border border-white/20 focus:border-teal-400 focus:bg-white/20 focus:outline-none text-sm transition-all shadow-lg"
                />
                {searchQuery && (
                  <button onClick={() => setSearchQuery('')} className="absolute right-3.5 top-1/2 -translate-y-1/2 text-xs text-slate-300 hover:text-white bg-white/10 px-2 py-0.5 rounded-full">
                    Clear
                  </button>
                )}
              </div>
            </div>
          </div>

          <div className="sticky top-16 z-30 bg-white border-b border-slate-200 shadow-sm px-4 py-3">
            <div className="max-w-7xl mx-auto flex gap-2 overflow-x-auto">
              {categories.map(cat => (
                <button
                  key={cat}
                  onClick={() => setActiveCategory(cat)}
                  className={`rounded-full px-4 py-1.5 text-xs sm:text-sm font-semibold transition-all whitespace-nowrap ${
                    activeCategory === cat
                      ? 'bg-blue-600 text-white shadow'
                      : 'bg-white text-slate-600 border border-slate-200 hover:border-blue-400'
                  }`}
                >
                  {cat}
                </button>
              ))}
            </div>
          </div>

          <div className="max-w-7xl mx-auto px-4 py-10">
            {filtered.length === 0 ? (
              <div className="text-center py-16 bg-white rounded-3xl border border-slate-200 p-8 max-w-xl mx-auto shadow-sm mb-10">
                <div className="text-4xl mb-3">📰</div>
                <h3 className="text-lg font-bold text-slate-900 mb-1">No articles found</h3>
                <p className="text-xs text-slate-500 mb-4">No published insights match "{searchQuery}" in {activeCategory}.</p>
                <button
                  onClick={() => { setSearchQuery(''); setActiveCategory('All'); }}
                  className="px-4 py-2 bg-blue-50 text-blue-700 rounded-xl text-xs font-bold hover:bg-blue-100"
                >
                  Reset Filter & Search
                </button>
              </div>
            ) : null}

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {filtered.map(article => (
                <ArticleCard
                  key={article.id}
                  article={article}
                  onClick={() => setSelectedArticle(article)}
                />
              ))}
            </div>
          </div>
        </div>
      );
    };

    // --- TWO-TIER PASSCODE PROTECTED PORTAL (Admin vs Multi-Pillar Contributor) ---
    const AdminPortal = ({ articles, ads, portfolio, contributors = [], portalType, onUpdateArticles, onUpdateAds, onUpdatePortfolio, onUpdateContributors, onExit }) => {
      // Role can be: null (locked), 'admin' (full access), or 'doctor' (write only)
      const [role, setRole] = React.useState(null);
      const [activeTab, setActiveTab] = React.useState('write');
      const [passcode, setPasscode] = React.useState('');
      const [error, setError] = React.useState('');

      // Contributor Registration Sub-tab in locked view: 'login' or 'register'
      const [contributorSubTab, setContributorSubTab] = React.useState('login');
      const [regForm, setRegForm] = React.useState({
        name: '', email: '', pillar: 'medical', credentials: '', licenseOrLink: '', bio: ''
      });
      const [regSuccess, setRegSuccess] = React.useState(false);

      const [articleForm, setArticleForm] = React.useState({
        title: '', category: 'Health & Medicine', authorName: '', authorCredential: '',
        authorRole: 'verified-doctor', authorBio: '', coverImage: '', content: ''
      });
      const [articleSuccess, setArticleSuccess] = React.useState(false);

      const [leads, setLeads] = React.useState(() => {
        try {
          return JSON.parse(localStorage.getItem('aqmt_leads') || '[]');
        } catch(e) {
          return [];
        }
      });

      const [adForm, setAdForm] = React.useState({
        title: '', price: '', priceUSD: '', category: 'Medical Equipment',
        location: '', duration: '30 Days (Active)', description: '', sellerName: '', sellerWhatsapp: '', imageUrl: ''
      });
      const [adSuccess, setAdSuccess] = React.useState(false);
      const [editingAdId, setEditingAdId] = React.useState(null);

      const [projForm, setProjForm] = React.useState({
        title: '', subtitle: '', category: 'Health-Tech & Medical Apps', client: '',
        duration: '', metrics: '', tags: '', description: '', liveUrl: '', imageUrl: ''
      });
      const [projSuccess, setProjSuccess] = React.useState(false);
      const [editingProjId, setEditingProjId] = React.useState(null);

      // Portal entry mode: 'admin' (via #admin or Ctrl+Shift+A) vs 'contributor' (via footer link or #contributor)
      const portalMode = portalType || (window.location.hash === '#contributor' ? 'contributor' : 'admin');

      const handleLogin = (e) => {
        e.preventDefault();
        const code = passcode.trim();
        if (portalMode === 'admin') {
          if (code === SITE_CONFIG.adminPassword) {
            setRole('admin');
            setError('');
          } else {
            setError('Access Denied. Invalid Admin Master Password.');
          }
        } else {
          // Contributor Studio
          if (code === SITE_CONFIG.doctorPassword) {
            setRole('doctor');
            setError('');
          } else {
            setError('Access Denied. Invalid Writer / Contributor Invite Passcode.');
          }
        }
      };

      const handleRegisterContributor = (e) => {
        e.preventDefault();
        let calculatedRole = 'Tech & Systems Specialist';
        if (regForm.pillar === 'business') {
          calculatedRole = 'Business Growth Strategist';
        } else if (regForm.pillar === 'medical') {
          const creds = (regForm.credentials || '').toLowerCase();
          if (creds.includes('student') || creds.includes('scholar') || creds.includes('mbbs student')) {
            calculatedRole = 'Medical Scholar / Student';
          } else if (creds.includes('nurse') || creds.includes('rn') || creds.includes('midwife')) {
            calculatedRole = 'Registered Nurse / Midwife';
          } else if (creds.includes('pharm') || creds.includes('pharmacist')) {
            calculatedRole = 'Clinical Pharmacist';
          } else if (creds.includes('lab') || creds.includes('mls') || creds.includes('medlab')) {
            calculatedRole = 'Medical Laboratory Scientist';
          } else {
            calculatedRole = 'Healthcare & Medical Professional';
          }
        }

        const newContrib = {
          id: Date.now(),
          name: regForm.name.trim(),
          email: regForm.email.trim(),
          pillar: regForm.pillar,
          roleName: calculatedRole,
          credentials: regForm.credentials.trim(),
          licenseOrLink: regForm.licenseOrLink.trim(),
          bio: regForm.bio.trim(),
          status: 'pending',
          date: 'Just now'
        };
        if (onUpdateContributors) {
          onUpdateContributors([newContrib, ...contributors]);
        }
        setRegSuccess(true);
        setRegForm({ name: '', email: '', pillar: 'medical', credentials: '', licenseOrLink: '', bio: '' });
        setTimeout(() => setRegSuccess(false), 9000);
      };

      const handleApproveContributor = (contribId) => {
        const updated = contributors.map(c => c.id === contribId ? { ...c, status: 'approved' } : c);
        if (onUpdateContributors) onUpdateContributors(updated);
      };

      const handleRejectContributor = (contribId) => {
        const updated = contributors.filter(c => c.id !== contribId);
        if (onUpdateContributors) onUpdateContributors(updated);
      };

      const handlePublishArticle = (e) => {
        e.preventDefault();
        const wordCount = articleForm.content.trim().split(/\s+/).filter(Boolean).length;
        // If submitted by Admin: automatically approved. If submitted by Contributor/Doctor: pending review
        const status = role === 'admin' ? 'approved' : 'pending';
        const newArt = {
          id: Date.now(),
          ...articleForm,
          status,
          date: 'Nov 11, 2026',
          readTime: `${Math.ceil(wordCount / 180)} min`,
          comments: []
        };
        onUpdateArticles([newArt, ...articles]);
        setArticleForm({ title: '', category: 'Health & Medicine', authorName: '', authorCredential: '', authorRole: 'verified-doctor', authorBio: '', coverImage: '', content: '' });
        setArticleSuccess(true);
        setTimeout(() => setArticleSuccess(false), 4000);
      };

      const handleApproveArticle = (articleId) => {
        const updated = articles.map(a => a.id === articleId ? { ...a, status: 'approved' } : a);
        onUpdateArticles(updated);
      };

      const handleRejectArticle = (articleId) => {
        const updated = articles.filter(a => a.id !== articleId);
        onUpdateArticles(updated);
      };

      const emptyAdForm = { title: '', price: '', priceUSD: '', category: 'Medical Equipment', location: '', duration: '30 Days (Active)', description: '', sellerName: '', sellerWhatsapp: '', imageUrl: '' };

      const handleStartEditAd = (ad) => {
        setEditingAdId(ad.id);
        setAdForm({
          title: ad.title || '',
          price: ad.price || '',
          priceUSD: ad.priceUSD || '',
          category: ad.category || 'Medical Equipment',
          location: ad.location || '',
          duration: ad.duration || '30 Days (Active)',
          description: ad.description || '',
          sellerName: ad.sellerName || '',
          sellerWhatsapp: ad.sellerWhatsapp || '',
          imageUrl: ad.imageUrl || ''
        });
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleCancelEditAd = () => {
        setEditingAdId(null);
        setAdForm(emptyAdForm);
      };

      const handleAddAd = (e) => {
        e.preventDefault();
        // Clean and validate WhatsApp digits
        const cleanWhatsapp = adForm.sellerWhatsapp.replace(/[^0-9]/g, '');
        if (editingAdId) {
          const updated = ads.map(a => a.id === editingAdId ? {
            ...a,
            ...adForm,
            sellerWhatsapp: cleanWhatsapp
          } : a);
          onUpdateAds(updated);
          setEditingAdId(null);
        } else {
          const newAd = {
            id: Date.now(),
            ...adForm,
            sellerWhatsapp: cleanWhatsapp,
            views: 10,
            clicks: 0,
            featured: true
          };
          onUpdateAds([newAd, ...ads]);
        }
        setAdForm(emptyAdForm);
        setAdSuccess(true);
        setTimeout(() => setAdSuccess(false), 3000);
      };

      const emptyProjForm = { title: '', subtitle: '', category: 'Health-Tech & Medical Apps', client: '', duration: '', metrics: '', tags: '', description: '', liveUrl: '', imageUrl: '' };

      const handleStartEditProject = (proj) => {
        setEditingProjId(proj.id);
        setProjForm({
          title: proj.title || '',
          subtitle: proj.subtitle || '',
          category: proj.category || 'Health-Tech & Medical Apps',
          client: proj.client || '',
          duration: proj.duration || '',
          metrics: proj.metrics || '',
          tags: Array.isArray(proj.techStack) ? proj.techStack.join(', ') : (Array.isArray(proj.tags) ? proj.tags.join(', ') : ''),
          description: proj.description || '',
          liveUrl: proj.liveUrl && proj.liveUrl !== '#' ? proj.liveUrl : '',
          imageUrl: proj.imageUrl || ''
        });
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleCancelEditProject = () => {
        setEditingProjId(null);
        setProjForm(emptyProjForm);
      };

      const handleAddProject = (e) => {
        e.preventDefault();
        const currentList = portfolio || [];
        const parsedTags = projForm.tags ? projForm.tags.split(',').map(t => t.trim()).filter(Boolean) : ['React', 'Next.js', 'Tailwind'];
        let updated;

        if (editingProjId) {
          updated = currentList.map(p => p.id === editingProjId ? {
            ...p,
            title: projForm.title.trim(),
            subtitle: projForm.subtitle ? projForm.subtitle.trim() : (p.subtitle || 'Custom Application'),
            category: projForm.category,
            client: projForm.client ? projForm.client.trim() : (p.client || 'Confidential Client'),
            duration: projForm.duration ? projForm.duration.trim() : (p.duration || '4 Weeks'),
            metrics: projForm.metrics ? projForm.metrics.trim() : (p.metrics || '100% Satisfaction'),
            techStack: parsedTags,
            description: projForm.description.trim(),
            liveUrl: projForm.liveUrl ? projForm.liveUrl.trim() : '',
            imageUrl: projForm.imageUrl ? projForm.imageUrl.trim() : (p.imageUrl || 'https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=600')
          } : p);
          setEditingProjId(null);
        } else {
          const newProj = {
            id: Date.now(),
            title: projForm.title.trim(),
            subtitle: projForm.subtitle ? projForm.subtitle.trim() : (projForm.client ? `Client: ${projForm.client.trim()}` : 'Custom Application'),
            category: projForm.category,
            client: projForm.client ? projForm.client.trim() : 'Confidential Client',
            duration: projForm.duration ? projForm.duration.trim() : '4 Weeks',
            metrics: projForm.metrics ? projForm.metrics.trim() : '100% Satisfaction',
            techStack: parsedTags,
            description: projForm.description.trim(),
            liveUrl: projForm.liveUrl ? projForm.liveUrl.trim() : '',
            imageUrl: projForm.imageUrl ? projForm.imageUrl.trim() : 'https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=600',
            featured: true,
            year: new Date().getFullYear()
          };
          updated = [newProj, ...currentList];
        }

        if (onUpdatePortfolio) {
          onUpdatePortfolio(updated);
        } else {
          try {
            localStorage.setItem('aqmt_portfolio', JSON.stringify(updated));
          } catch(err) {}
        }
        setProjForm(emptyProjForm);
        setProjSuccess(true);
        setTimeout(() => setProjSuccess(false), 4000);
      };

      const handleDeleteProject = (projId) => {
        if (!confirm('Are you sure you want to remove this project from your portfolio?')) return;
        const currentList = portfolio || [];
        const updated = currentList.filter(p => p.id !== projId);
        if (onUpdatePortfolio) {
          onUpdatePortfolio(updated);
        } else {
          try {
            localStorage.setItem('aqmt_portfolio', JSON.stringify(updated));
          } catch(err) {}
        }
      };

      // 1. LOCKED VIEW (Requires Passcode or Allows New Contributor Registration)
      if (!role) {
        return (
          <div className="min-h-[80vh] flex items-center justify-center p-4">
            <div className="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-2xl max-w-lg w-full">
              <div className="w-16 h-16 rounded-2xl bg-blue-100 text-blue-600 flex items-center justify-center mx-auto mb-4 font-black text-2xl">
                {portalMode === 'admin' ? '🛡️' : '🩺'}
              </div>
              <h2 className="text-2xl font-black text-slate-900 text-center mb-1">
                {portalMode === 'admin' ? 'AQMedTech Admin Portal' : 'Contributor & Author Studio'}
              </h2>
              <p className="text-slate-500 text-xs text-center mb-6">
                {portalMode === 'admin'
                  ? 'Private master portal for Executive Agency control. Enter Admin Password.'
                  : 'Multi-disciplinary publishing desk for Doctors, Tech Innovators & Business Strategists.'}
              </p>

              {/* Sub-tab switcher for Contributor Studio */}
              {portalMode === 'contributor' && (
                <div className="flex rounded-xl bg-slate-100 p-1 mb-6">
                  <button
                    type="button"
                    onClick={() => { setContributorSubTab('login'); setError(''); }}
                    className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${
                      contributorSubTab === 'login'
                        ? 'bg-white text-slate-900 shadow-sm'
                        : 'text-slate-500 hover:text-slate-900'
                    }`}
                  >
                    🔑 Author Sign In
                  </button>
                  <button
                    type="button"
                    onClick={() => { setContributorSubTab('register'); setError(''); }}
                    className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${
                      contributorSubTab === 'register'
                        ? 'bg-white text-blue-600 shadow-sm'
                        : 'text-slate-500 hover:text-slate-900'
                    }`}
                  >
                    📝 Register as Contributor
                  </button>
                </div>
              )}

              {portalMode === 'admin' || contributorSubTab === 'login' ? (
                <form onSubmit={handleLogin} className="space-y-4">
                  <input
                    type="password"
                    required
                    placeholder={portalMode === 'admin' ? "Enter Admin Password..." : "Enter Writer Invite Code (e.g. doctor2026)..."}
                    value={passcode}
                    onChange={(e) => setPasscode(e.target.value)}
                    className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-blue-500 focus:outline-none text-sm text-center font-mono tracking-widest text-lg"
                  />
                  {error && (
                    <p className="text-xs text-red-600 font-semibold bg-red-50 p-2.5 rounded-lg border border-red-200 text-center">
                      {error}
                    </p>
                  )}
                  <button type="submit" className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm rounded-xl shadow">
                    {portalMode === 'admin' ? 'Unlock Admin Command →' : 'Unlock Author Studio →'}
                  </button>
                </form>
              ) : (
                /* Contributor Registration Form */
                <div>
                  {regSuccess ? (
                    <div className="p-4 bg-teal-50 border border-teal-200 rounded-2xl text-center space-y-2">
                      <div className="text-3xl">🎉</div>
                      <h4 className="font-bold text-teal-900 text-sm">Application Submitted Successfully!</h4>
                      <p className="text-xs text-teal-800 leading-relaxed">
                        Your credentials have been queued for administrative verification. Once reviewed by the AQMedTech Editorial Board, your contributor profile and badge will be activated.
                      </p>
                      <button
                        onClick={() => { setContributorSubTab('login'); setRegSuccess(false); }}
                        className="mt-3 px-4 py-2 bg-teal-600 text-white text-xs font-bold rounded-xl shadow hover:bg-teal-700"
                      >
                        Proceed to Author Sign In →
                      </button>
                    </div>
                  ) : (
                    <form onSubmit={handleRegisterContributor} className="space-y-3.5 text-left">
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">Domain of Expertise *</label>
                        <select
                          value={regForm.pillar}
                          onChange={(e) => setRegForm(p => ({ ...p, pillar: e.target.value }))}
                          className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs font-medium focus:border-blue-500 focus:outline-none bg-slate-50"
                        >
                          <option value="medical">🩺 Healthcare & Medical Scholars (Doctors, Nurses, Pharmacists, MedLab & MBBS/Health Students)</option>
                          <option value="tech">💻 Tech & Digital Health Specialist (Software Engineer, AI, Data)</option>
                          <option value="business">📈 Business & Growth Strategist (Healthcare Administrator, Consultant)</option>
                        </select>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-1">Full Name *</label>
                          <input
                            type="text"
                            required
                            placeholder={regForm.pillar === 'medical' ? "e.g. Dr. Tunde Adebayo or Fatima Bello" : "e.g. Chukwudi Okafor"}
                            value={regForm.name}
                            onChange={(e) => setRegForm(p => ({ ...p, name: e.target.value }))}
                            className="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-xs focus:border-blue-500 focus:outline-none"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-1">Email Address *</label>
                          <input
                            type="email"
                            required
                            placeholder="e.g. name@hospital.com or university email"
                            value={regForm.email}
                            onChange={(e) => setRegForm(p => ({ ...p, email: e.target.value }))}
                            className="w-full px-3.5 py-2 rounded-xl border border-slate-200 text-xs focus:border-blue-500 focus:outline-none"
                          />
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">
                          {regForm.pillar === 'medical' ? "Healthcare Credentials, Specialty, or Student Level *" : regForm.pillar === 'tech' ? "Technical Role & Qualifications *" : "Business Title & Specialization *"}
                        </label>

                          }`}
                        >
                          <div className="w-9 h-9 rounded-xl flex items-center justify-center mb-2" style={{background: svc.color + '20', color: svc.color}}>
                            <IconComponent size={20} />
                          </div>
                          <p className="font-bold text-slate-900 text-xs sm:text-sm">{svc.label}</p>
                          <p className="text-[10px] text-slate-400 mt-1 line-clamp-1">{svc.desc}</p>
                        </button>
                      );
                    })}
                  </div>
                </>
              ) : (
                <>
                  <button onClick={() => setStep(1)} className="text-slate-400 hover:text-slate-700 text-xs mb-4 flex items-center gap-1 font-semibold">
                    ← Change Service
                  </button>
                  <h3 className="text-xl font-black text-slate-900 mb-1">Tell us about your project</h3>
                  <p className="text-xs text-slate-400 mb-5">
                    Selected: <span className="font-bold text-blue-600">{services.find(s => s.id === selectedService)?.label}</span>
                  </p>
                  <form onSubmit={handleSubmitDashboard} className="space-y-3">
                    <div>
                      <input
                        type="text"
                        placeholder="Your Full Name *"
                        required
                        value={form.name}
                        onChange={(e) => setForm(p => ({...p, name: e.target.value}))}
                        className="w-full px-4 py-2.5 rounded-xl border text-sm focus:border-blue-500 focus:outline-none"
                      />
                    </div>
                    <div>
                      <input
                        type="tel"
                        placeholder="WhatsApp / Phone Number (e.g. +2348012345678) *"
                        required
                        value={form.phone}
                        onChange={(e) => setForm(p => ({...p, phone: e.target.value}))}
                        className="w-full px-4 py-2.5 rounded-xl border text-sm focus:border-blue-500 focus:outline-none font-mono"
                      />
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <select
                        value={form.budget}
                        onChange={(e) => setForm(p => ({...p, budget: e.target.value}))}
                        className="w-full px-4 py-2.5 rounded-xl border text-sm"
                      >
                        <option value="">Budget: Flexible / Let's Discuss</option>
                        <option>Under ₦100,000</option>
                        <option>₦100,000 – ₦500,000</option>
                        <option>₦500,000 – ₦2,000,000</option>
                        <option>₦2,000,000+</option>
                      </select>
                      <input
                        type="email"
                        placeholder="Email (Optional)"
                        value={form.email}
                        onChange={(e) => setForm(p => ({...p, email: e.target.value}))}
                        className="w-full px-4 py-2.5 rounded-xl border text-sm focus:border-blue-500 focus:outline-none"
                      />
                    </div>
                    <textarea
                      rows={2}
                      placeholder="Brief details or specifications (Optional)..."
                      value={form.details}
                      onChange={(e) => setForm(p => ({...p, details: e.target.value}))}
                      className="w-full px-4 py-2 rounded-xl border text-sm resize-none focus:border-blue-500 focus:outline-none"
                    />
                    <div className="flex flex-col sm:flex-row gap-2 pt-1">
                      <button
                        type="button"
                        onClick={handleSendWA}
                        className="flex-1 py-3 rounded-xl font-bold text-xs sm:text-sm text-white flex items-center justify-center gap-1.5 shadow"
                        style={{background:'#25D366'}}
                      >
                        <Send size={14} /> Instant Quote on WhatsApp
                      </button>
                      <button
                        type="submit"
                        className="flex-1 py-3 rounded-xl font-bold text-xs sm:text-sm text-white bg-blue-600 hover:bg-blue-700 transition-colors shadow"
                      >
                        Save & Request Callback
                      </button>
                    </div>
                  </form>
                </>
              )}
            </div>
          </div>
        </div>
      );
    };

    // =========================================================================
    // 4. MAIN APP INTEGRATOR (ROUTING, SHORTCUTS, FOOTER)
    // =========================================================================
    const App = () => {
      React.useEffect(() => {
        initializeData();
      }, []);

      const [currentPage, setCurrentPage] = React.useState('home');
      const [portalType, setPortalType] = React.useState('admin');
      const [modalOpen, setModalOpen] = React.useState(false);
      const [modalType, setModalType] = React.useState('website');

      const [ads, setAds] = React.useState(() => loadData('aqmt_ads', SEED_ADS));
      const [articles, setArticles] = React.useState(() => loadData('aqmt_articles', SEED_ARTICLES));
      const [portfolio, setPortfolio] = React.useState(() => loadData('aqmt_portfolio', PORTFOLIO_PROJECTS));
      const [contributors, setContributors] = React.useState(() => loadData('aqmt_contributors', SEED_CONTRIBUTORS));

      const updateAds = (newAds) => { setAds(newAds); saveData('aqmt_ads', newAds); };
      const updateArticles = (newArts) => { setArticles(newArts); saveData('aqmt_articles', newArts); };
      const updatePortfolio = (newPort) => { setPortfolio(newPort); saveData('aqmt_portfolio', newPort); };
      const updateContributors = (newContribs) => { setContributors(newContribs); saveData('aqmt_contributors', newContribs); };

      const handleUpdateSingleArticle = (updated) => {
        const list = articles.map(a => a.id === updated.id ? updated : a);
        updateArticles(list);
      };

      const navigate = (page, mode = 'admin') => {
        setCurrentPage(page);
        if (page === 'admin') {
          setPortalType(mode);
          window.location.hash = mode === 'contributor' ? '#contributor' : '#admin';
        } else if (window.location.hash === '#admin' || window.location.hash === '#contributor') {
          window.location.hash = '';
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const openModal = (type = 'website') => {
        setModalType(type);
        setModalOpen(true);
      };

      // --- HIDDEN ROUTE & KEYBOARD SHORTCUT DETECTOR ---
      React.useEffect(() => {
        const checkHash = () => {
          if (window.location.hash === '#admin') {
            setPortalType('admin');
            setCurrentPage('admin');
          } else if (window.location.hash === '#contributor') {
            setPortalType('contributor');
            setCurrentPage('admin');
          }
        };
        checkHash();
        window.addEventListener('hashchange', checkHash);

        // Secret Admin shortcut: Ctrl + Shift + A (or Cmd + Shift + A)
        const handleKeyDown = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
            e.preventDefault();
            navigate('admin', 'admin');
          }
        };
        window.addEventListener('keydown', handleKeyDown);

        return () => {
          window.removeEventListener('hashchange', checkHash);
          window.removeEventListener('keydown', handleKeyDown);
        };
      }, []);

      const { ArrowRight } = Icons;

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900 font-sans selection:bg-blue-600 selection:text-white">

          <main className="flex-1 pt-16">
            {currentPage === 'home' && (
              <div>
                <Hero onOpenModal={openModal} onNavigate={navigate} />

                {/* Strip 1: Featured Portfolio Projects */}
                <Portfolio projects={portfolio} onOpenModal={openModal} />

                {/* Strip 2: Featured Products & Equipment (Marketplace Deals) */}

                  <div className="max-w-7xl mx-auto px-4 sm:px-6">
                    <div className="flex flex-col md:flex-row md:items-end justify-between mb-8">
                      <div>
                        <span className="text-xs font-bold text-amber-600 tracking-wider uppercase bg-amber-100 px-3 py-1 rounded-full">
                          Marketplace Deals
                        </span>
                        <h2 className="text-2xl sm:text-3xl font-black text-slate-900 mt-2">
                          Featured Products & Equipment
                        </h2>
                      </div>
                      <button
                        onClick={() => navigate('marketplace')}
                        className="mt-3 md:mt-0 text-sm font-bold text-blue-600 hover:text-blue-800 flex items-center gap-1"
                      >
                        View Full Marketplace <ArrowRight size={14} />
                      </button>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                      {ads.slice(0, 3).map(ad => (
                        <AdCard key={ad.id} ad={ad} />
                      ))}
                    </div>
                  </div>
                </section>

                {/* Strip 3: Latest Articles */}
                <section className="py-16 bg-slate-50 border-t border-slate-200">
                  <div className="max-w-7xl mx-auto px-4 sm:px-6">
                    <div className="flex flex-col md:flex-row md:items-end justify-between mb-8">
                      <div>
                        <span className="text-xs font-bold text-teal-700 tracking-wider uppercase bg-teal-100 px-3 py-1 rounded-full">
                          Medical & Tech Insights
                        </span>
                        <h2 className="text-2xl sm:text-3xl font-black text-slate-900 mt-2">
                          Latest Doctor & Technical Articles
                        </h2>
                      </div>
                      <button
                        onClick={() => navigate('news')}
                        className="mt-3 md:mt-0 text-sm font-bold text-blue-600 hover:text-blue-800 flex items-center gap-1"
                      >
                        Read All Articles <ArrowRight size={14} />
                      </button>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                      {articles.slice(0, 3).map(art => (
                        <ArticleCard key={art.id} article={art} onClick={() => navigate('news')} />
                      ))}
                    </div>
                  </div>
                </section>

                {/* Why Choose Us */}
                <section className="py-20 text-white" style={{ background: '#0F172A' }}>
                  <div className="max-w-7xl mx-auto px-4 sm:px-6">
                    <div className="text-center max-w-2xl mx-auto mb-14">
                      <span className="text-xs font-bold text-teal-400 uppercase tracking-widest bg-teal-950 px-3 py-1 rounded-full border border-teal-800">
                        Why AQMedTech
                      </span>
                      <h2 className="text-3xl sm:text-4xl font-black mt-3">

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                      {[
                        { icon: '🏥', title: 'Medical Compliance', desc: 'Secure patient workflows and HIPAA/clinical standards.' },
                        { icon: '⚡', title: 'High-Speed Web', desc: 'Sub-1.2 second load times on fast React architecture.' },
                        { icon: '💬', title: 'WhatsApp Funnels', desc: 'Instant conversion triggers to turn traffic into paying clients.' },

                        📢 Advertise Your Product

                    </div>
                  </div>
                </section>
              </div>
            )}

            {currentPage === 'marketplace' && (
              <MarketplacePage ads={ads} onUpdateAds={updateAds} onOpenModal={openModal} />
            )}

            {currentPage === 'news' && (
              <NewsPage articles={articles} ads={ads} onUpdateArticle={handleUpdateSingleArticle} onOpenModal={openModal} />
            )}

            {currentPage === 'admin' && (
              <AdminPortal
                articles={articles}
                ads={ads}
                portfolio={portfolio}
                contributors={contributors}
                portalType={portalType}
                onUpdateArticles={updateArticles}
                onUpdateAds={updateAds}
                onUpdatePortfolio={updatePortfolio}
                onUpdateContributors={updateContributors}
                onExit={() => navigate('home')}
              />
            )}
          </main>

          {/* Executive Footer */}
          <footer className="bg-slate-950 text-slate-400 border-t border-slate-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-12">
              <div className="grid grid-cols-1 md:grid-cols-4 gap-8">
                <div className="md:col-span-2">
                  <div className="flex items-center gap-2 cursor-pointer mb-3" onClick={() => navigate('home')}>
                    <div className="w-8 h-8 rounded-lg flex items-center justify-center text-white font-black text-xs" style={{background:'linear-gradient(135deg,#2563EB,#0D9488)'}}>
                      AQ
                    </div>
                    <span className="text-white font-black text-lg">AQMedTech Innovations</span>
                  </div>
                  <p className="text-slate-400 text-xs sm:text-sm max-w-md leading-relaxed mb-4">
                    High-performance websites, custom medical & health software, and high-converting product advertising. Designed for African and global healthcare pioneers.
                  </p>
                  <p className="text-xs text-slate-500">
                    WhatsApp: <a href={`https://wa.me/${SITE_CONFIG.whatsappNumber}`} target="_blank" className="text-teal-400 font-semibold">+234 810 644 0538</a> · Email: <span className="text-slate-400">abdullahiabdulqaharak@gmail.com</span>
                  </p>
                </div>
                <div>
                  <h4 className="text-white font-bold text-xs uppercase tracking-wider mb-3">Public Directory</h4>
                  <ul className="space-y-2 text-xs">
                    <li><button onClick={() => navigate('home')} className="hover:text-white">Home & Services</button></li>
                    <li><button onClick={() => navigate('marketplace')} className="hover:text-white">Marketplace Ads</button></li>
                    <li><button onClick={() => navigate('news')} className="hover:text-white">Health & Tech News</button></li>
                  </ul>
                </div>
                <div>
                  <h4 className="text-white font-bold text-xs uppercase tracking-wider mb-3">Agency Info</h4>
                  <p className="text-xs text-slate-400 leading-relaxed mb-2">📍 Lagos, Nigeria & Worldwide Remote</p>
                  <button onClick={() => openModal('website')} className="mt-2 px-4 py-2 bg-blue-600 text-white rounded-lg text-xs font-bold">
                    Hire Us Now
                  </button>
                  <div className="mt-4 pt-3 border-t border-slate-900">
                    <button 
                      onClick={() => navigate('admin', 'contributor')} 
                      className="text-[11px] text-teal-400/80 hover:text-teal-300 flex items-center gap-1.5 transition-colors font-medium"
                    >
                      ✍️ Write for Us / Contributor Studio (Medical, Tech & Business)
                    </button>
                  </div>
                </div>
              </div>
              <div className="border-t border-slate-900 mt-8 pt-6 flex flex-col sm:flex-row justify-between text-xs text-slate-600">
                <p>© 2026 AQMedTech Innovations. All rights reserved.</p>
              </div>
            </div>
          </footer>

          <HireModal isOpen={modalOpen} onClose={() => setModalOpen(false)} initialType={modalType} />

          {/* Floating WhatsApp Quick-Help Widget */}
          <div className="fixed bottom-6 right-6 z-40 group">
            <a
              href={`https://wa.me/${SITE_CONFIG.whatsappNumber}?text=Hello%20AQMedTech!%20I%20visited%20your%20platform%20and%20would%20like%20to%20discuss%20a%20project%20or%20ad%20placement.`}
              target="_blank"
              rel="noopener noreferrer"
              className="flex items-center gap-2.5 px-4 py-3 rounded-full text-white font-bold text-xs sm:text-sm shadow-2xl transition-all duration-300 hover:scale-105 hover:shadow-green-500/30"
              style={{ background: 'linear-gradient(135deg, #25D366, #128C7E)' }}
            >
              <span className="relative flex h-3 w-3">
                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-white opacity-75"></span>
                <span className="relative inline-flex rounded-full h-3 w-3 bg-white"></span>
              </span>
              <Icons.MessageCircle size={18} />
              <span className="hidden sm:inline">Chat With Us</span>
            </a>
          </div>
        </div>
      );
    };

    // Mount Root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
